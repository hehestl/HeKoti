# Hekoti stack: Postgres + Redis + app (+ optional LanguageTool).
#
# Migrations: on every `hekoti-app` container start, `docker-entrypoint.sh` runs
# `npx prisma migrate deploy` against `DATABASE_URL` from `.env` — no manual
# `docker exec` needed for a fresh or empty database.
#
# Rebuild without cache (`docker compose build --no-cache`) is only needed if
# you previously edited files inside a running container or hit a corrupted
# image layer; normal `docker compose up -d --build` is enough after `git pull`.

services:
  hekoti-postgres:
    image: postgres:17-alpine
    container_name: hekoti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hekoti_db
      POSTGRES_USER: hekoti_user
      POSTGRES_PASSWORD: hekoti_password
    volumes:
      - hekoti_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hekoti_user -d hekoti_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  hekoti-redis:
    image: redis:7-alpine
    container_name: hekoti-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - hekoti_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  hekoti-languagetool:
    image: erikvl87/languagetool:latest
    container_name: hekoti-languagetool
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8010/v2/languages >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 120s

  hekoti-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hekoti-app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      hekoti-postgres:
        condition: service_healthy
      hekoti-redis:
        condition: service_healthy
    ports:
      - "3310:3310"
    volumes:
      - hekoti_uploads:/app/public/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||'3310')+'/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  hekoti_pg_data:
  hekoti_redis_data:
  hekoti_uploads:
