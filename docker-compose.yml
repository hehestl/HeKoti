# Hekoti stack: Postgres + Redis + app (+ optional embedded LanguageTool).
#
# Multi-instance: set in `.env` per deploy root — HEKOTI_INSTANCE, COMPOSE_PROJECT_NAME,
# HEKOTI_HOST_PORT, HEKOTI_DOCKER_NETWORK, HEKOTI_LT_MODE, COMPOSE_PROFILES.
# See `.env.example`, `.env.world.example`, docs/README.*.
#
# Deploy manifest: .agentrules (taxonomy, paths Profile B, port registry)
# Prod data/logs bind: /var/lib/hh/{instance}/data (see .agentrules paths.*)
#
# WARNING: networks/logging — .cursor/rules/docker-rules.md
# image: и container_name — .cursor/rules/docker-naming.md
# Host ports — .cursor/rules/port-registry.md
#
# Reverse proxy (Nginx Proxy Manager): docker network create proxy-network
# NPM upstream: http://hh-${HEKOTI_INSTANCE}-app:3310 (container_name on npm_proxy network).
#
# Embedded LT (default chat): COMPOSE_PROFILES=embedded-lt
# External shared LT (world+): see deploy/docker-compose.external-lt.yml + deploy/docker-compose.shared-lt.yml

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  hekoti-postgres:
    image: postgres:17-alpine
    container_name: hh-${HEKOTI_INSTANCE:-hekoti}-pg
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hekoti_db}
      POSTGRES_USER: ${POSTGRES_USER:-hekoti_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hekoti_password}
    volumes:
      - hekoti_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  hekoti-redis:
    image: redis:7-alpine
    container_name: hh-${HEKOTI_INSTANCE:-hekoti}-redis
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - hekoti_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  hekoti-languagetool:
    profiles: ["embedded-lt"]
    image: erikvl87/languagetool:latest
    container_name: hh-${HEKOTI_INSTANCE:-hekoti}-lt
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8010/v2/languages >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 120s
    networks:
      - internal

  hekoti-app:
    image: hh-hekoti-app:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HEKOTI_APP_VERSION: ${HEKOTI_APP_VERSION:-0.0.0}
        # Bake from .env (NEXT_PUBLIC_* must be set at build time)
        NEXT_PUBLIC_HERON_AUTH_URL: ${NEXT_PUBLIC_HERON_AUTH_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-${APP_URL}}
        NEXT_PUBLIC_HERON_OAUTH_CLIENT_ID: ${NEXT_PUBLIC_HERON_OAUTH_CLIENT_ID:-hekoti-wiki}
    container_name: hh-${HEKOTI_INSTANCE:-hekoti}-app
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: .env
        required: false
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3310"
      APP_URL: ${APP_URL:-http://localhost:3310}
      POSTGRES_DB: ${POSTGRES_DB:-hekoti_db}
      POSTGRES_USER: ${POSTGRES_USER:-hekoti_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hekoti_password}
      POSTGRES_HOST: ${POSTGRES_HOST:-hekoti-postgres}
      REDIS_URL: ${REDIS_URL:-redis://hekoti-redis:6379}
      LANGUAGETOOL_URL: ${LANGUAGETOOL_URL:-http://hekoti-languagetool:8010}
      HEKOTI_ADMIN_EMAIL: ${HEKOTI_ADMIN_EMAIL:-admin}
      HEKOTI_ADMIN_PASSWORD: ${HEKOTI_ADMIN_PASSWORD:-hehe}
      HEKOTI_FORCE_ADMIN_RESET: ${HEKOTI_FORCE_ADMIN_RESET:-0}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      AUTH_PENDING_SECRET: ${AUTH_PENDING_SECRET:-}
      HEKOTI_TOTP_ENCRYPTION_KEY: ${HEKOTI_TOTP_ENCRYPTION_KEY:-}
      # Heron SSO (runtime; public URL is baked via build.args)
      HEKOTI_HERON_AUTH_ENABLED: ${HEKOTI_HERON_AUTH_ENABLED:-0}
      HEKOTI_HERON_DEFAULT_RETURN: ${HEKOTI_HERON_DEFAULT_RETURN:-/ru/admin}
      HERON_AUTH_API_URL: ${HERON_AUTH_API_URL:-http://heron-auth:8080}
      HERON_JWT_ISSUER: ${HERON_JWT_ISSUER:-https://id.hehestl.su}
      HERON_JWT_AUDIENCE: ${HERON_JWT_AUDIENCE:-hehe-ecosystem}
      HERON_OAUTH_CLIENT_ID: ${HERON_OAUTH_CLIENT_ID:-hekoti-wiki}
      HERON_JWT_PUBLIC_KEY_PEM: ${HERON_JWT_PUBLIC_KEY_PEM:-}
      HERON_JWT_PUBLIC_KEY_PATH: ${HERON_JWT_PUBLIC_KEY_PATH:-}
      HERON_FETCH_TIMEOUT_MS: ${HERON_FETCH_TIMEOUT_MS:-}
    depends_on:
      hekoti-postgres:
        condition: service_healthy
      hekoti-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HEKOTI_HOST_PORT:-3310}:3310"
    volumes:
      - hekoti_uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "node", "/app/scripts/docker-healthcheck.cjs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - internal
      - npm_proxy

networks:
  internal:
    # Per-instance bridge; override via HEKOTI_DOCKER_NETWORK (legacy chat: hh-network).
    name: ${HEKOTI_DOCKER_NETWORK:-hh-${HEKOTI_INSTANCE:-hekoti}-net}
    driver: bridge
  npm_proxy:
    external: true
    name: ${NPM_PROXY_NETWORK:-proxy-network}

volumes:
  hekoti_pg_data:
    name: hh-${HEKOTI_INSTANCE:-hekoti}-pg-data
  hekoti_redis_data:
    name: hh-${HEKOTI_INSTANCE:-hekoti}-redis-data
  hekoti_uploads:
    name: hh-${HEKOTI_INSTANCE:-hekoti}-uploads
