version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # eslint-config-next’s bundled eslint-plugin-react is not compatible with ESLint 10 yet (getFilename).
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      next:
        patterns:
          - "next"
          - "eslint-config-next"
      prisma:
        patterns:
          - "@prisma/*"
          - "prisma"
