# Regenerates the Docker Compose Mermaid block in README.md when compose or this workflow changes.
name: Compose Mermaid README

on:
  push:
    branches: [main, master, hehe]
    paths:
      - "docker-compose.yml"
      - "scripts/update_compose_mermaid_readme.py"
      - ".github/workflows/compose-mermaid.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compose-mermaid-readme
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pull viz image
        run: docker pull derlin/docker-compose-viz-mermaid

      - name: Refresh README Mermaid diagram
        run: python3 scripts/update_compose_mermaid_readme.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No README changes."
          else
            git commit -m "docs: refresh Docker Compose Mermaid diagram"
            git push
          fi

